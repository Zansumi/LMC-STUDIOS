<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LMC Studios ™</title>
<script>
  // Redirige cualquier ruta (/servicios, /proyecto/xxx...) a index.html conservando la ruta en ?/
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body><!-- xmas:start -->
<style id="xm-css">
#xm-lights{position:fixed;top:0;left:0;width:100%;height:58px;pointer-events:none;z-index:9990;overflow:hidden}
#xm-lights svg{display:block}
.xm-wire{fill:none;stroke:#5a5a5a;stroke-width:1.6}
.xm-cap{fill:#6b6b6b}
.xm-b{animation:xmTw 2.6s ease-in-out infinite;color:#fff}
.xm-b.c0{fill:#ff4040;color:#ff4040}.xm-b.c1{fill:#ffc93d;color:#ffc93d}.xm-b.c2{fill:#3ddc84;color:#3ddc84}.xm-b.c3{fill:#4aa8ff;color:#4aa8ff}.xm-b.c4{fill:#ff7ad9;color:#ff7ad9}
.xm-b.d1{animation-delay:-.5s}.xm-b.d2{animation-delay:-1s}.xm-b.d3{animation-delay:-1.5s}.xm-b.d4{animation-delay:-2s}
@keyframes xmTw{0%,100%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}50%{opacity:.4;filter:drop-shadow(0 0 1px currentColor)}}
#xm-snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9989}
#xm-toggle{position:fixed;left:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(16,22,40,.78);color:#fff;font-size:18px;line-height:1;cursor:pointer;z-index:9991;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .2s,opacity .2s}
#xm-toggle:hover{transform:scale(1.08)}
#xm-toggle:focus-visible{outline:2px solid #ffc93d;outline-offset:3px}
#xm-toggle[aria-pressed="false"]{opacity:.6}
@media (prefers-reduced-motion:reduce){.xm-b{animation:none}}
@media print{#xm-lights,#xm-snow,#xm-toggle{display:none!important}}
</style>
<script id="xm-js">
(function(){
if(window.__xm)return;window.__xm=1;
var KEY='xm-off',off=false;
try{off=localStorage.getItem(KEY)==='1'}catch(e){}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var b=document.body,lights=document.createElement('div'),cv=document.createElement('canvas'),btn=document.createElement('button');
lights.id='xm-lights';lights.setAttribute('aria-hidden','true');
cv.id='xm-snow';cv.setAttribute('aria-hidden','true');
btn.id='xm-toggle';btn.type='button';btn.textContent='\u2744';btn.setAttribute('aria-label','Activar o desactivar la decoraci\u00f3n navide\u00f1a');
b.appendChild(lights);b.appendChild(cv);b.appendChild(btn);
function buildLights(){
  var w=innerWidth,seg=w<600?96:132,n=Math.ceil(w/seg)+1,sag=16,h=58,i,k,t,x,y,p='',bl='';
  var C=[0,1,2,3,4],ci=0;
  for(i=0;i<n;i++){
    var x0=i*seg,x1=x0+seg;
    p+='<path class="xm-wire" d="M'+x0+' 4Q'+(x0+seg/2)+' '+(4+2*sag)+' '+x1+' 4"/>';
    for(k=0;k<3;k++){
      t=[.2,.5,.8][k];x=x0+seg*t;y=4+4*sag*t*(1-t);
      bl+='<rect class="xm-cap" x="'+(x-2.5)+'" y="'+(y-1)+'" width="5" height="6" rx="1"/>'+
          '<ellipse class="xm-b c'+C[ci%5]+' d'+(ci%5)+'" cx="'+x+'" cy="'+(y+11)+'" rx="4.6" ry="6.6"/>';
      ci++;
    }
  }
  lights.innerHTML='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+p+bl+'</svg>';
}
var ctx=cv.getContext('2d'),W=0,H=0,fl=[],raf=0;
function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:-10,r:Math.random()*2.6+.8,v:Math.random()*.9+.35,s:Math.random()*6.28,a:Math.random()*.45+.5}}
function size(){
  var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  var N=Math.round(Math.min(110,W/11));while(fl.length<N)fl.push(mk(true));fl.length=N;
}
function tick(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.shadowColor='rgba(110,150,220,.7)';ctx.shadowBlur=4;
  for(var i=0;i<fl.length;i++){
    var f=fl[i];f.s+=.012;f.x+=Math.sin(f.s)*.5+.15;f.y+=f.v;
    if(f.y>H+10||f.x>W+10){fl[i]=f=mk(false);f.x=Math.random()*W}
    ctx.globalAlpha=f.a;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.2832);ctx.fill();
  }
  raf=requestAnimationFrame(tick);
}
function start(){if(!raf&&!reduce&&!off&&!document.hidden){size();raf=requestAnimationFrame(tick)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}ctx.clearRect(0,0,W,H)}
function apply(){
  lights.style.display=off?'none':'';cv.style.display=off?'none':'';
  btn.setAttribute('aria-pressed',off?'false':'true');
  off?stop():start();
}
btn.addEventListener('click',function(){off=!off;try{localStorage.setItem(KEY,off?'1':'0')}catch(e){}apply()});
document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){buildLights();if(raf)size()},150)});
buildLights();apply();
})();
</script>
<!-- xmas:end -->
</body>
</html>
