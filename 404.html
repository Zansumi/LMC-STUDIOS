<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LMC Studios ™</title>
<script>
  // Redirige cualquier ruta (/servicios, /proyecto/xxx...) a index.html conservando la ruta en ?/
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body><!-- xmas:start -->
<div id="xm-tree" aria-hidden="true"><svg viewBox="0 0 120 170" aria-hidden="true"><defs><radialGradient id="xmts"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="14" r="14" fill="url(#xmts)"/><polygon points="60,4 64,14 75,14 66,20 70,31 60,24 50,31 54,20 45,14 56,14" fill="#ffd54a"/><polygon points="60,22 92,78 28,78" fill="#1f8a4c"/><polygon points="60,48 100,112 20,112" fill="#25a05a"/><polygon points="60,80 108,148 12,148" fill="#2dbb6a"/><rect x="53" y="148" width="14" height="20" rx="2" fill="#7a4a22"/><circle cx="52" cy="62" r="3.2" fill="#ff4040"/><circle cx="68" cy="70" r="3" fill="#ffd54a"/><circle cx="44" cy="96" r="3.4" fill="#4aa8ff"/><circle cx="72" cy="98" r="3.2" fill="#ff4040"/><circle cx="60" cy="86" r="2.8" fill="#ff7ad9"/><circle cx="36" cy="132" r="3.6" fill="#ffd54a"/><circle cx="62" cy="126" r="3.4" fill="#ff4040"/><circle cx="86" cy="134" r="3.6" fill="#4aa8ff"/><circle cx="50" cy="142" r="2.8" fill="#ff7ad9"/><circle cx="78" cy="118" r="2.8" fill="#ffd54a"/><path d="M34 72Q60 82 84 70M26 106Q60 120 94 104M20 140Q60 156 100 138" fill="none" stroke="#ffe9a8" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/></svg></div>
<style id="xm-css">
#xm-lights{position:fixed;left:0;top:0;width:100%;height:26px;pointer-events:none;z-index:45;overflow:hidden}
#xm-lights svg{display:block}
.xm-wire{fill:none;stroke:#6a6a6a;stroke-width:1.2;opacity:.8}
.xm-g{animation:xmTw 2.4s ease-in-out infinite}
.xm-g.g1{animation-delay:-.5s}.xm-g.g2{animation-delay:-1s}.xm-g.g3{animation-delay:-1.5s}.xm-g.g4{animation-delay:-2s}
@keyframes xmTw{0%,100%{opacity:1}50%{opacity:.35}}
#xm-tree{position:fixed;right:8px;bottom:0;width:150px;pointer-events:none;z-index:41;opacity:.55;filter:blur(1.6px)}
#xm-tree svg{display:block;width:100%;height:auto}
@media (max-width:600px){#xm-tree{width:84px;right:4px;opacity:.5}}
#xm-snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:44}
#xm-toggle{position:fixed;left:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(16,22,40,.82);color:#fff;font-size:18px;line-height:1;cursor:pointer;z-index:9991;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .2s,opacity .2s}
#xm-toggle:hover{transform:scale(1.08)}
#xm-toggle:focus-visible{outline:2px solid #ffc93d;outline-offset:3px}
#xm-toggle[aria-pressed="false"]{opacity:.6}
@media (prefers-reduced-motion:reduce){.xm-g{animation:none}}
@media print{#xm-tree,#xm-lights,#xm-snow,#xm-toggle{display:none!important}}
</style>
<script id="xm-js">
(function(){
if(window.__xm)return;window.__xm=1;
var KEY='xm-off',off=false;
try{off=localStorage.getItem(KEY)==='1'}catch(e){}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var b=document.body,lights=document.createElement('div'),cv=document.createElement('canvas'),btn=document.createElement('button');
lights.id='xm-lights';lights.setAttribute('aria-hidden','true');
cv.id='xm-snow';cv.setAttribute('aria-hidden','true');
btn.id='xm-toggle';btn.type='button';btn.textContent='\u2744';btn.setAttribute('aria-label','Activar o desactivar la decoraci\u00f3n navide\u00f1a');
b.appendChild(lights);b.appendChild(cv);b.appendChild(btn);
var COL=['#ff4040','#ffc93d','#3ddc84','#4aa8ff','#ff7ad9'];
function place(){
  var n=document.querySelector('#nav,header.nav,body>header,header'),top=0;
  if(n){var cs=getComputedStyle(n);
    if(cs.position==='fixed'||cs.position==='sticky'){lights.style.position='fixed';top=n.offsetHeight}
    else{lights.style.position='absolute';top=n.getBoundingClientRect().bottom+(window.pageYOffset||0)}}
  lights.style.top=top+'px';
}
function buildLights(){
  var w=innerWidth,m=w<600,seg=m?112:150,n=Math.ceil(w/seg)+1,sag=8,i,k,t,x,y,p='',g=['','','','',''],ci=0,defs='';
  for(i=0;i<5;i++)defs+='<radialGradient id="xmg'+i+'"><stop offset="0" stop-color="'+COL[i]+'" stop-opacity=".85"/><stop offset="1" stop-color="'+COL[i]+'" stop-opacity="0"/></radialGradient>';
  for(i=0;i<n;i++){
    var x0=i*seg,x1=x0+seg;
    p+='M'+x0+' 2Q'+(x0+seg/2)+' '+(2+2*sag)+' '+x1+' 2';
    for(k=0;k<3;k++){
      t=[.2,.5,.8][k];x=x0+seg*t;y=2+4*sag*t*(1-t);
      var c=ci%5;
      g[c]+='<circle cx="'+x.toFixed(1)+'" cy="'+(y+4).toFixed(1)+'" r="7" fill="url(#xmg'+c+')"/><circle cx="'+x.toFixed(1)+'" cy="'+(y+4).toFixed(1)+'" r="2.6" fill="'+COL[c]+'"/>';
      ci++;
    }
  }
  var out='<svg width="'+w+'" height="26" viewBox="0 0 '+w+' 26"><defs>'+defs+'</defs><path class="xm-wire" d="'+p+'"/>';
  for(i=0;i<5;i++)out+='<g class="xm-g g'+i+'">'+g[i]+'</g>';
  lights.innerHTML=out+'</svg>';
}
var ctx=cv.getContext('2d'),W=0,H=0,fl=[],raf=0,last=0,mob=false;
function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:-10,r:Math.random()*2.2+.8,v:Math.random()*.8+.35,s:Math.random()*6.28,a:Math.random()*.4+.5}}
function size(){
  var d=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;mob=W<600;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  var N=mob?32:Math.round(Math.min(85,W/16));while(fl.length<N)fl.push(mk(true));fl.length=N;
}
function tick(ts){
  raf=requestAnimationFrame(tick);
  if(mob&&ts-last<33)return;last=ts;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';
  for(var i=0;i<fl.length;i++){
    var f=fl[i];f.s+=.012;f.x+=Math.sin(f.s)*.5+.15;f.y+=f.v;
    if(f.y>H+10||f.x>W+10){fl[i]=f=mk(false);f.x=Math.random()*W}
    ctx.globalAlpha=f.a;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.2832);ctx.fill();
  }
}
function start(){if(!raf&&!reduce&&!off&&!document.hidden){size();raf=requestAnimationFrame(tick)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}ctx.clearRect(0,0,W,H)}
function apply(){
  lights.style.display=off?'none':'';var tr=document.getElementById('xm-tree');if(tr)tr.style.display=off?'none':'';cv.style.display=off?'none':'';
  btn.setAttribute('aria-pressed',off?'false':'true');
  off?stop():start();
}
btn.addEventListener('click',function(){off=!off;try{localStorage.setItem(KEY,off?'1':'0')}catch(e){}apply()});
document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){buildLights();place();if(raf)size()},150)});
addEventListener('load',place);
buildLights();place();apply();
})();
</script>
<!-- xmas:end -->
</body>
</html>
